services:
  db:
    image: postgres:15-alpine
    container_name: emergencias_cartagena_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emergencias_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergencias_cartagena_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/emergencias_db
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs

volumes:
  postgres_data:
